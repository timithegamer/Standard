[build]
  publish = "site"
  functions = "site/netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Der Verwaltungsbereich gehoert nicht in Suchmaschinen und nicht in
# Zwischenspeicher. Der eigentliche Schutz sitzt im Server (Anmeldung),
# das hier verhindert nur, dass die Seite irgendwo liegenbleibt.
[[headers]]
  for = "/verwaltung.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, private"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, private"
